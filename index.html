<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kalshi Metals</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;
--green:#3fb950;--red:#f85149;--amber:#d29922;--blue:#58a6ff;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 64px}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center}
.lockcard{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:36px;width:min(380px,90vw);text-align:center}
.lockcard h1{margin:0 0 6px;font-size:20px}.lockcard p{color:var(--dim);margin:0 0 20px;font-size:13px}
.lockcard input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
background:var(--bg);color:var(--fg);font-size:15px;margin-bottom:12px}
.lockcard button{width:100%;padding:10px;border-radius:8px;border:0;background:#238636;
color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.lockcard button:disabled{opacity:.6}.err{color:var(--red);font-size:13px;min-height:20px;margin-top:10px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:8px}
header h1{margin:0;font-size:22px}.gen{color:var(--dim);font-size:13px}
.btn{display:inline-block;background:#21262d;border:1px solid var(--line);border-radius:8px;
padding:6px 14px;font-size:13px;color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}
.mhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.mhead h2{margin:0;font-size:18px}
.badge{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid}
.badge.live{color:var(--green);border-color:var(--green)}
.badge.closed{color:var(--red);border-color:var(--red)}
.meta{color:var(--dim);font-size:13px;margin:2px 0 10px}
.meta b{color:var(--fg);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
th{color:var(--dim);text-align:left;font-weight:500;border-bottom:1px solid var(--line);padding:5px 8px}
td{padding:5px 8px;border-bottom:1px solid #21262d;font-family:var(--mono)}
td:first-child{font-family:inherit}
.num{text-align:right}th.num{text-align:right}
.pos{color:var(--green)}.neg{color:var(--red)}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;background:#21262d;color:var(--dim)}
.tag.structural{color:var(--amber)}.tag.signal-driven{color:var(--blue)}
h3{font-size:14px;margin:18px 0 4px}.note{color:var(--dim);font-size:13px}
details{margin:8px 0}summary{cursor:pointer;color:var(--dim);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .v{font-family:var(--mono);font-size:18px}.kpi .l{color:var(--dim);font-size:11px}
.call{display:flex;align-items:baseline;gap:12px;font-size:22px;font-weight:700;
padding:14px 18px;border-radius:10px;border:1px solid;margin:12px 0 6px}
.call small{font-size:13px;font-weight:400;color:var(--dim)}
.call.hi{color:var(--green);border-color:var(--green);background:rgba(63,185,80,.07)}
.call.lo{color:var(--red);border-color:var(--red);background:rgba(248,81,73,.07)}
.call.none{color:var(--dim);border-color:var(--line);background:var(--bg)}
.proc{margin:10px 0;padding-left:4px;list-style:none;counter-reset:step}
.proc li{margin:9px 0;padding-left:34px;position:relative;font-size:14px;counter-increment:step}
.proc li::before{content:counter(step);position:absolute;left:0;top:1px;width:22px;height:22px;
border-radius:50%;background:#21262d;border:1px solid var(--line);color:var(--dim);
font-size:12px;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.proc b{color:var(--fg)}
.chip{display:inline-block;font-size:12px;padding:3px 12px;border-radius:999px;
background:#21262d;border:1px solid var(--line);color:var(--dim);margin:4px 6px 4px 0}
.verdict{font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);margin-top:8px}
footer{color:var(--dim);font-size:12px;margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
</style></head><body>
<div id="lock" class="lock"><div class="lockcard">
  <h1>🔒 Kalshi Metals</h1>
  <p>This dashboard is encrypted. Enter the password to decrypt it in your browser.</p>
  <input id="pw" type="password" placeholder="Password" autofocus
         onkeydown="if(event.key==='Enter')unlock()">
  <button id="go" onclick="unlock()">Unlock</button>
  <div id="err" class="err"></div>
</div></div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITERS,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NONCE)},key,b64(CT));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(){
  const pw=document.getElementById('pw').value,go=document.getElementById('go');
  go.disabled=true;document.getElementById('err').textContent='';
  try{
    const data=await decrypt(pw);
    sessionStorage.setItem('km_pw',pw);
    render(data);
  }catch(e){
    document.getElementById('err').textContent='Wrong password.';
    go.disabled=false;
  }
}
const esc=s=>String(s??'–').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(x,d=2)=>(x==null||isNaN(x))?'–':Number(x).toFixed(d);
const sgn=x=>x==null?'–':`<span class="${x>=0?'pos':'neg'}">${x>=0?'+':''}${Number(x).toFixed(2)}</span>`;
function tbl(heads,rows){return `<table><tr>${heads.map(h=>`<th class="${h.n?'num':''}">${h.t}</th>`).join('')}</tr>${rows.join('')}</table>`}
function metalCard(m){
  const badge=m.live?'<span class="badge live">● LIVE</span>':'<span class="badge closed">● market closed</span>';
  let h=`<div class="card"><div class="mhead"><h2>${esc(m.name)}</h2><span class="tag">${esc(m.series)}</span>${badge}
  <a class="btn" href="${esc(m.market_url)}" target="_blank">Today's market on Kalshi ↗</a></div>`;

  // 1. The headline call banner.
  const hl=m.headline||{};
  if(hl.valid){
    const hi=hl.call==='HIGHER';
    const mph=hl.market_p_higher;
    const mkt=(mph==null)?'':` · market says ${hi===(mph>=0.5)?'the same':(mph>=0.5?'HIGHER':'LOWER')} (${Math.round(Math.max(mph,1-mph)*100)}%)`;
    h+=`<div class="call ${hi?'hi':'lo'}">${hi?'▲ HIGHER':'▼ LOWER'} than $${f(hl.reference_price)}
    <small>${Math.round(hl.confidence*100)}% confidence${mkt}</small></div>`;
  }else{
    h+=`<div class="call none">— NO CALL <small>market closed / no live price — we never call on a stale anchor</small></div>`;
  }

  // 2. The accuracy chips.
  const cr=m.call_record||{};
  if(cr.total>0){
    h+=`<span class="chip">Our calls: ${cr.correct}/${cr.total} correct (${Math.round(100*cr.correct/cr.total)}%) since ${esc(cr.since)}</span>`;
    if(cr.market_total>0)h+=`<span class="chip">Market's own calls: ${cr.market_correct}/${cr.market_total}</span>`;
  }else{
    h+=`<span class="chip">Track record: 0 calls scored yet — tracking since ${esc(cr.since||'2026-06-10')}</span>`;
  }

  // 3. The 4-step process with today's values.
  if(m.process&&m.process.length){
    h+=`<ol class="proc">${m.process.map(s=>{
      const i=s.indexOf(' — ');
      return `<li><b>${esc(i>0?s.slice(0,i):'')}</b>${esc(i>0?' — '+s.slice(i+3):s)}</li>`;
    }).join('')}</ol>`;
  }

  // 4. Everything else collapses into Full detail.
  h+=`<details><summary><b>Full detail</b> (trades, alpha recommendations, ladder, Brier scorecard)</summary>`;
  if(m.event){
    h+=`<div class="meta"><b>${esc(m.event)}</b> · settles ${esc(m.close_time)}<br>
    anchor <b>$${f(m.anchor)}/${esc(m.unit)}</b> <span>(${esc(m.anchor_source)})</span> ·
    σ <b>${f((m.sigma||0)*100)}%/day</b> · drift <b>${((m.drift||0)*100).toFixed(2)}%</b> ·
    Metalminer <b>${esc(m.signal)}</b>${m.live?'':' · <span class="neg">edges below are phantoms (stale anchor)</span>'}</div>`;
  } else h+=`<div class="note">No prediction this run.</div>`;
  for(const w of ['open','close']){
    const win=m.windows&&m.windows[w];if(!win)continue;
    h+=`<h3>${w==='open'?'Open':'Close'}-run paper trades${win.capped?' <span class="tag">stake-capped</span>':''}</h3>`;
    if(!win.trades.length)h+=`<div class="note">No strikes cleared min-edge after fees — correct outcome vs an efficient ladder.</div>`;
    else h+=tbl([{t:'strike',n:1},{t:'side'},{t:'@',n:1},{t:'win-p',n:1},{t:'edge',n:1},{t:'qty',n:1},{t:'stake',n:1},{t:'EV',n:1}],
      win.trades.map(t=>`<tr><td class="num">${f(t.strike)}</td><td>${esc(t.side).toUpperCase()}</td><td class="num">${f(t.cost)}</td><td class="num">${f(t.win_p)}</td><td class="num">${sgn(t.edge)}</td><td class="num">${t.n}</td><td class="num">$${f(t.stake)}</td><td class="num">${sgn(t.ev)}</td></tr>`));
    if(win.recs&&win.recs.length){
      const r=win.recs[0];
      h+=`<div class="note"><b style="color:var(--fg)">Top alpha:</b> ${esc(r.action)} ${f(r.strike)} @ ${f(r.price)}
      (edge ${r.edge>=0?'+':''}${f(r.edge)}) <span class="tag ${esc(r.source)}">${esc(r.source)}</span></div>`;
    }
    if(win.control)h+=`<div class="note">Control (favorite ≥ ${Math.round((win.control.threshold||0.55)*100)}%): ${win.control.n} bets, stake $${f(win.control.stake)}</div>`;
  }
  if(m.ladder&&m.ladder.length){
    h+=`<details><summary>Ladder near the anchor (±1.5σ)</summary>`+
    tbl([{t:'strike',n:1},{t:'market mid',n:1},{t:'model p',n:1},{t:'edge',n:1}],
      m.ladder.map(r=>`<tr><td class="num">${f(r.strike)}</td><td class="num">${f(r.mid)}</td><td class="num">${f(r.p)}</td><td class="num">${sgn(r.edge)}</td></tr>`))+`</details>`;
  }
  const s=m.scorecard||{};
  h+=`<h3>Performance — ${s.n_events||0} settled event(s)</h3>`;
  if(!s.n_events)h+=`<div class="note">Nothing settled yet.</div>`;
  else{
    h+=`<div class="kpis">
    <div class="kpi"><div class="v">${sgn(s.model_pnl)}</div><div class="l">MODEL PNL (${s.model_trades||0} trades, ${s.model_wins||0} won)</div></div>
    <div class="kpi"><div class="v">${sgn(s.control_pnl)}</div><div class="l">CONTROL PNL (${s.control_trades||0} bets, ${s.control_wins||0} won)</div></div>
    <div class="kpi"><div class="v">${f(s.brier_overlay,4)}</div><div class="l">MODEL BRIER (overlay)</div></div>
    <div class="kpi"><div class="v">${f(s.brier_market,4)}</div><div class="l">MARKET BRIER</div></div></div>`;
    const ahead=(s.model_pnl||0)>(s.control_pnl||0);
    h+=`<div class="verdict">${ahead?'✅ model ahead of control':'⚠️ control ahead — model not yet earning its complexity'} ·
    n=${s.n_events} ${s.n_events<30?'(provisional, need ≥30)':''}</div>`;
    if(m.recent&&m.recent.length){
      h+=`<details><summary>Recent settled events</summary>`+
      tbl([{t:'event'},{t:'settle',n:1},{t:'Brier ovl',n:1},{t:'Brier mkt',n:1},{t:'model PnL',n:1},{t:'control PnL',n:1}],
        m.recent.map(e=>`<tr><td>${esc(e.event)}${e.orphan?' <span class="tag">orphan</span>':''}</td><td class="num">${f(e.settle)}</td><td class="num">${f(e.brier_overlay,4)}</td><td class="num">${f(e.brier_market,4)}</td><td class="num">${sgn(e.pnl)}</td><td class="num">${sgn(e.control_pnl)}</td></tr>`));
      h+=`</details>`;
    }
  }
  return h+`</details></div>`;
}
function render(data){
  document.getElementById('lock').style.display='none';
  const app=document.getElementById('app');app.style.display='block';
  let h=`<header><h1>Kalshi Metals</h1><span class="gen">generated ${esc(data.generated_at)}</span>
  <a class="btn" href="${esc(data.rerun_url)}" target="_blank">▶ Re-run now</a></header>
  <div class="note">Paper trading only — nothing here places real orders. The re-run button opens GitHub Actions
  (needs your GitHub login); press <i>Run workflow</i>, then reload this page ~5 min later.</div>`;
  for(const m of data.metals)h+=metalCard(m);
  h+=`<footer><b>Known flaws (honest footnote):</b> ${esc(data.flaws)}<br><br>
  Site refreshes each trading day ~9:35 ET. Data is end-to-end encrypted with your password — this page is
  unreadable without it.</footer>`;
  app.innerHTML=h;
}
(async()=>{const pw=sessionStorage.getItem('km_pw');
 if(pw){try{render(await decrypt(pw))}catch(e){sessionStorage.removeItem('km_pw')}}})();
</script></body></html>
